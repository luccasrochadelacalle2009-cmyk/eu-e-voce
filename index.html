<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>US · Our Universe</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1769AA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Nosso pequeno universo, compartilhado por duas pessoas.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#f7f9fc;
  --surface:#ffffff;
  --surface-2:#f1f5f9;
  --text:#111827;
  --muted:#667085;
  --blue:#1769AA;
  --blue-solid:#1769AA;
  --blue-deep:#0f4c81;
  --blue-soft:#e8f2fb;
  --line:#e4eaf1;
  --danger:#b94756;
  --danger-soft:#fdecef;
  --success:#1f7a5c;
  --shadow:0 6px 20px rgba(16,42,67,.06);
  --nav-bg:rgba(255,255,255,.93);
  --overlay:rgba(10,22,36,.42);
  --toast-bg:#111827;
  --toast-text:#ffffff;
  --radius:18px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0b111a;
  --surface:#131c28;
  --surface-2:#1a2635;
  --text:#f3f7fb;
  --muted:#a8b5c4;
  --blue:#6fb6f2;
  --blue-solid:#17558b;
  --blue-deep:#17558b;
  --blue-soft:#173047;
  --line:#263546;
  --danger:#f08e99;
  --danger-soft:#3a2028;
  --success:#64c9a8;
  --shadow:0 8px 26px rgba(0,0,0,.24);
  --nav-bg:rgba(19,28,40,.93);
  --overlay:rgba(0,0,0,.62);
  --toast-bg:#f3f7fb;
  --toast-text:#111827;
  color-scheme:dark;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]):not([data-theme="dark"]){
    --bg:#0b111a;--surface:#131c28;--surface-2:#1a2635;--text:#f3f7fb;--muted:#a8b5c4;
    --blue:#6fb6f2;--blue-solid:#17558b;--blue-deep:#17558b;--blue-soft:#173047;--line:#263546;
    --danger:#f08e99;--danger-soft:#3a2028;--success:#64c9a8;
    --shadow:0 8px 26px rgba(0,0,0,.24);--nav-bg:rgba(19,28,40,.93);
    --overlay:rgba(0,0,0,.62);--toast-bg:#f3f7fb;--toast-text:#111827;color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;min-height:100dvh;background:var(--bg);color:var(--text);
  font:16px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding:0 0 calc(96px + env(safe-area-inset-bottom));
  -webkit-tap-highlight-color:transparent;
}
body.modal-open{overflow:hidden}
button,input,textarea,select{font:inherit}
button{color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{
  outline:2px solid var(--blue);outline-offset:2px
}
h1,h2,h3,p{margin-top:0}
h1{font-size:30px;line-height:1.16;margin-bottom:7px;letter-spacing:-.035em}
h2{font-size:19px;line-height:1.25;margin-bottom:10px;letter-spacing:-.02em}
h3{font-size:16px;line-height:1.3;margin-bottom:8px}
p{margin-bottom:8px}
.muted{color:var(--muted);font-size:13.5px}
.eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.16em;font-weight:800;color:var(--muted);margin-bottom:6px}
.small-note{font-size:12px;color:var(--muted)}
a{color:var(--blue);text-underline-offset:3px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* Topbar e cabeçalho */
.topbar{position:sticky;top:0;z-index:20;background:var(--nav-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:860px;margin:auto;padding:calc(10px + env(safe-area-inset-top)) 17px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.12em;line-height:1}
.brand-mark{width:38px;height:38px;border-radius:13px;background:var(--blue-soft);display:grid;place-items:center;color:var(--blue);font-size:19px}
.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.2em;font-weight:700;margin-top:4px}
.top-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:42px;height:42px;flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:14px;display:grid;place-items:center;font-size:18px;transition:transform .16s ease,border-color .16s ease,background .16s ease}
.icon-btn:hover{border-color:var(--blue)}
.icon-btn:active{transform:scale(.94)}
.icon-btn.small{width:38px;height:38px;border-radius:12px;font-size:17px}
.page-head{display:flex;align-items:flex-start;gap:12px;margin:5px 2px 18px}
.head-copy{flex:1;min-width:0}
.page-title:focus{outline:none}
.page-sub{margin-bottom:0;max-width:55ch}
.head-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.head-action{flex:0 0 auto;padding-top:16px}
.back-btn{width:42px;height:42px;flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:14px;font-size:20px;display:grid;place-items:center;transition:transform .16s ease,border-color .16s ease}
.back-btn:active{transform:translateX(-2px) scale(.96)}
.back-btn:hover{border-color:var(--blue)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 11px;background:var(--blue-soft);color:var(--blue);font-size:12px;font-weight:750}

/* Conteúdo */
#app{max-width:860px;margin:0 auto;padding:18px 17px 28px}
#app.page-enter{animation:pageIn .26s ease both}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:20px 2px 10px}
.section-head h2{margin:0}
.link-btn{border:0;background:transparent;color:var(--blue);font-weight:750;font-size:13.5px;min-height:40px;padding:6px 4px;white-space:nowrap}
.link-btn:active{opacity:.65}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:11px 0;box-shadow:var(--shadow);min-width:0}
.card.soft{background:var(--surface-2);box-shadow:none}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-head h2,.card-head h3{margin:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-height:112px;padding:15px;border:1px solid var(--line);border-radius:17px;background:var(--surface);text-align:left;color:var(--text);box-shadow:var(--shadow);transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}
.tile:hover{border-color:var(--blue)}
.tile:active{transform:scale(.975);box-shadow:none}
.tile .emoji{font-size:22px;line-height:1;margin-bottom:9px}
.tile b{display:block;font-size:14.5px}
.tile small{color:var(--muted);font-size:12px;line-height:1.35}

/* Botões e formulários */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;border:1px solid transparent;background:var(--blue-solid);color:#fff;border-radius:13px;padding:10px 16px;font-weight:750;transition:transform .15s ease,filter .15s ease,background .15s ease,border-color .15s ease}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:scale(.975)}
.btn.secondary{background:var(--blue-soft);color:var(--blue)}
.btn.ghost{background:transparent;color:var(--muted);border-color:var(--line)}
.btn.ghost:hover{color:var(--blue);border-color:var(--blue)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.small{min-height:38px;padding:7px 12px;font-size:12.5px;border-radius:11px}
.btn.full{width:100%}
input,textarea,select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:13px;padding:11px 13px;background:var(--surface);color:var(--text);outline:none;margin:5px 0 11px;min-width:0;font-size:16px}
input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
textarea{min-height:104px;resize:vertical}
label{display:block;font-size:12.5px;color:var(--muted);font-weight:700;margin-top:4px}
input[type="file"]{padding:9px 11px}
input[type="file"]::file-selector-button{border:1px solid var(--line);background:var(--surface-2);color:var(--text);border-radius:9px;padding:7px 10px;margin-right:10px;font:inherit;cursor:pointer}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.segmented{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.segmented .theme-option{padding:9px 6px;font-size:13px}
.theme-option.active{background:var(--blue-solid);color:#fff;border-color:transparent}

/* Home */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:24px;background:var(--blue-deep);color:#fff;box-shadow:0 14px 30px rgba(15,76,129,.18);margin:14px 0 4px}
.hero:after{content:"✧";position:absolute;font-size:140px;right:8px;top:-52px;color:#ffffff18;transform:rotate(16deg);pointer-events:none}
.hero-top{display:flex;align-items:center;gap:9px;position:relative;z-index:1}
.hero-mark{width:28px;height:28px;border-radius:9px;background:#ffffff1f;display:grid;place-items:center}
.hero .eyebrow{color:#d8ebfa;margin:0}
.hero h1{position:relative;z-index:1;font-size:29px;max-width:90%;margin:12px 0;color:#fff}
.hero-sep{opacity:.7;font-size:.8em;vertical-align:middle}
.hero-count{display:flex;align-items:baseline;gap:8px;position:relative;z-index:1;margin:12px 0 4px}
.hero-count strong{font-size:42px;line-height:1;font-weight:800;letter-spacing:-.05em}
.hero-count span{font-size:14px;color:#e3f1fc}
.hero-note{position:relative;z-index:1;margin:12px 0 0;color:#e3f1fc}
.hero-foot{position:relative;z-index:1;font-size:12.5px;color:#d8ebfa;margin-top:14px}
.spotlight-body{display:flex;align-items:center;gap:12px}
.spotlight-icon{width:44px;height:44px;flex:0 0 auto;border-radius:14px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-size:20px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--line);border-radius:17px;overflow:hidden;background:var(--line);gap:1px}
.stat{background:var(--surface);padding:14px 15px}
.stat strong{display:block;font-size:23px;line-height:1.1;letter-spacing:-.04em}
.stat span{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.activity-list{display:grid;gap:8px}
.activity{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:1px solid var(--line);border-radius:15px;background:var(--surface);padding:12px 14px;transition:transform .15s ease,border-color .15s ease}
.activity:hover{border-color:var(--blue)}
.activity:active{transform:scale(.99)}
.activity-kind{flex:0 0 auto;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);background:var(--blue-soft);padding:5px 8px;border-radius:9px}
.activity .list-main{min-width:0;flex:1}
.question-card{border-left:3px solid var(--blue);border-radius:6px var(--radius) var(--radius) 6px}

/* Listas e mídia */
.list-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-main{min-width:0;flex:1}
.list-main b{display:block;overflow-wrap:anywhere}
.list-main small{display:block;color:var(--muted);font-size:12px;margin-top:2px;overflow-wrap:anywhere}
.empty{text-align:center;padding:26px 14px;color:var(--muted)}
.empty.compact{padding:18px 12px}
.empty .big{font-size:29px;margin-bottom:7px;color:var(--blue)}
.empty b{display:block;color:var(--text);margin-bottom:4px}
.photo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.memory{overflow:hidden;border:1px solid var(--line);background:var(--surface);border-radius:17px;box-shadow:var(--shadow);min-width:0}
.memory img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--surface-2)}
.memory-placeholder{aspect-ratio:4/3;display:grid;place-items:center;background:var(--surface-2);font-size:30px;color:var(--blue)}
.memory-body{padding:12px}
.memory-body b{font-size:14px;display:block}
.memory-body p{margin:5px 0;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.memory-body small{font-size:11.5px;color:var(--muted)}
.memory-body .btn{margin-top:9px}
.letter{border-left:3px solid var(--blue);background:var(--surface-2);padding:13px 14px;border-radius:0 14px 14px 0;margin:10px 0}
.letter p{white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:8px}
.letter small{color:var(--muted)}
.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:10px 0 4px}
.progress span{height:100%;display:block;background:var(--blue);border-radius:99px;transition:width .3s ease}
.plan-title.done{text-decoration:line-through;color:var(--muted)}

/* Calendário */
.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.month-label{text-align:center;flex:1}
.month-label .eyebrow{margin-bottom:2px}
.month-label b{text-transform:capitalize;font-size:17px}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;text-align:center}
.calendar .weekday{color:var(--muted);font-size:11px;font-weight:800;padding-bottom:3px}
.calendar .day{position:relative;min-width:0;aspect-ratio:1;min-height:40px;border:1px solid transparent;border-radius:12px;background:var(--surface-2);color:var(--text);font-size:13.5px;font-weight:650;display:grid;place-items:center;transition:transform .14s ease,background .14s ease,color .14s ease}
.calendar .day:active{transform:scale(.93)}
.calendar .day.today{border-color:var(--blue)}
.calendar .day.selected{background:var(--blue-solid);color:#fff;border-color:var(--blue-solid)}
.calendar .day.has-event:after{content:"";width:4px;height:4px;border-radius:50%;background:var(--blue);position:absolute;bottom:5px;left:calc(50% - 2px)}
.calendar .day.selected.has-event:after{background:#fff}
.calendar .blank{min-height:40px}

/* Navegação */
nav{position:fixed;z-index:25;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;gap:3px;background:var(--nav-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 30px rgba(16,42,67,.12);padding:6px}
nav button{flex:1;min-width:0;min-height:50px;border:0;background:transparent;color:var(--muted);font-size:10.5px;font-weight:750;padding:6px 2px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:color .16s ease,background .16s ease,transform .16s ease}
nav button:active{transform:scale(.96)}
nav .nav-icon{font-size:19px;line-height:1;transition:transform .2s ease}
nav .nav-label{font-size:10.5px;line-height:1}
nav button.active{color:var(--blue);background:var(--blue-soft)}
nav button.active .nav-icon{transform:translateY(-1px)}

/* Toast e modal */
.toast{position:fixed;z-index:50;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,12px);opacity:0;background:var(--toast-bg);color:var(--toast-text);padding:12px 16px;border-radius:14px;font-size:13px;font-weight:650;pointer-events:none;transition:opacity .2s ease,transform .2s ease;max-width:min(90%,420px);text-align:center;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal-host{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));opacity:0;pointer-events:none;transition:opacity .18s ease}
.modal-host.open{opacity:1;pointer-events:auto}
.modal-backdrop{position:absolute;inset:0;background:var(--overlay)}
.modal{position:relative;width:min(100%,420px);max-height:calc(100dvh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.22);transform:translateY(12px) scale(.98);transition:transform .2s ease}
.modal-host.open .modal{transform:translateY(0) scale(1)}
.modal-icon{width:42px;height:42px;border-radius:14px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-size:19px;font-weight:800;margin-bottom:13px}
.modal.danger .modal-icon{background:var(--danger-soft);color:var(--danger)}
.modal h2{margin-bottom:8px}
.modal p{color:var(--muted);font-size:14px;margin-bottom:20px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}

@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

@media(min-width:620px){
  #app{padding:22px 24px 34px}
  .topbar-inner{padding-left:24px;padding-right:24px}
  .hero{padding:30px}
  .hero h1{font-size:34px;max-width:80%}
  .photo-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(min-width:760px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid.quick{grid-template-columns:repeat(4,minmax(0,1fr))}
  .stats{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media(min-width:900px){
  nav{left:50%;right:auto;transform:translateX(-50%);width:520px;bottom:18px}
  .photo-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media(max-width:380px){
  #app{padding:14px 13px 26px}
  .topbar-inner{padding-left:13px;padding-right:13px}
  .hero{padding:20px}
  .hero h1{font-size:26px;max-width:100%}
  .hero-count strong{font-size:37px}
  .card{padding:15px}
  .tile{padding:13px;min-height:106px}
  h1{font-size:27px}
  .segmented{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<nav id="nav" aria-label="Navegação principal"></nav>
<div id="modalHost" class="modal-host"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
const STORAGE_KEY="us";
const defaults={letters:[],events:[],wall:[],plans:[],journal:[],music:[],places:[],answers:[],challenges:[],theme:"light",n1:"",n2:"",since:"",profile1:"",profile2:""};
let S={...defaults};
try{S={...S,...JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}")}}catch(e){}
["letters","events","wall","plans","journal","music","places","answers","challenges"].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});
if(!["light","dark","system"].includes(S.theme))S.theme="light";
let tab="home",previousTab="home",subtab="more",ym=new Date(),selectedDate=iso(new Date()),toastTimer,modalTimer,previousFocus=null,confirmCallback=null;
const darkQuery=matchMedia("(prefers-color-scheme: dark)");
const reducedMotion=matchMedia("(prefers-reduced-motion: reduce)");
const NAV_ITEMS=[["home","⌂","Início"],["calendar","▦","Agenda"],["memories","▧","Memórias"],["connect","♡","Conexão"],["more","•••","Mais"]];

function $(id){return document.getElementById(id)}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmtDate(v){if(!v)return"";let p=String(v).split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:String(v)}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s}
function formatToday(){return cap(new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"}))}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(S))}catch(e){notify("Não foi possível salvar. Talvez o armazenamento esteja cheio.")}}
function notify(msg){let el=$("toast");if(!el)return;el.textContent=msg;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),2400)}
function themeMeta(t){return t==="dark"?{icon:"☾",label:"Escuro"}:t==="system"?{icon:"◐",label:"Automático"}:{icon:"☀",label:"Claro"}}
function updateMetaTheme(){let m=document.querySelector('meta[name="theme-color"]');if(!m)return;let dark=S.theme==="dark"||(S.theme==="system"&&darkQuery.matches);m.setAttribute("content",dark?"#0b111a":"#1769AA")}
function syncThemeUI(){
  document.querySelectorAll("[data-theme-option]").forEach(b=>{let active=b.dataset.themeOption===S.theme;b.classList.toggle("active",active);b.setAttribute("aria-pressed",active?"true":"false")});
  let btn=$("themeToggle");if(btn){let m=themeMeta(S.theme),icon=btn.querySelector("span");if(icon)icon.textContent=m.icon;btn.setAttribute("aria-label","Tema: "+m.label+". Toque para alternar.");btn.title="Tema: "+m.label}
}
function applyTheme(t){
  if(t==="system")document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",t);
  updateMetaTheme();syncThemeUI();
}
function setTheme(t){if(!["light","dark","system"].includes(t))return;S.theme=t;applyTheme(t);save();notify("Tema "+themeMeta(t).label.toLowerCase()+" ativado.")}
function cycleTheme(){let order=["light","dark","system"],next=order[(order.indexOf(S.theme)+1)%order.length];setTheme(next)}
if(darkQuery.addEventListener)darkQuery.addEventListener("change",updateMetaTheme);else darkQuery.addListener(updateMetaTheme);

/* Modal de confirmação, acessível e responsivo */
function closeModal(immediate){
  let host=$("modalHost");if(!host||!host.classList.contains("open"))return;
  host.classList.remove("open");document.body.classList.remove("modal-open");
  clearTimeout(modalTimer);modalTimer=setTimeout(()=>{host.innerHTML=""},immediate?0:190);
  if(previousFocus&&document.contains(previousFocus))previousFocus.focus({preventScroll:true});
  previousFocus=null;confirmCallback=null;
}
function openModal(opts){
  let host=$("modalHost");clearTimeout(modalTimer);host.innerHTML="";
  previousFocus=document.activeElement;confirmCallback=opts.onConfirm;
  host.innerHTML='<div class="modal-backdrop" data-modal-close></div>'+
    '<section class="modal '+(opts.danger?"danger":"")+'" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalDesc">'+
      '<div class="modal-icon" aria-hidden="true">'+(opts.danger?"!":"✦")+'</div>'+
      '<h2 id="modalTitle">'+esc(opts.title)+'</h2>'+
      '<p id="modalDesc">'+esc(opts.description)+'</p>'+
      '<div class="modal-actions">'+
        '<button class="btn ghost" data-modal-close>'+esc(opts.cancelLabel||"Cancelar")+'</button>'+
        '<button class="btn '+(opts.danger?"danger":"")+'" id="modalConfirm">'+esc(opts.confirmLabel||"Confirmar")+'</button>'+
      '</div>'+
    '</section>';
  host.classList.add("open");document.body.classList.add("modal-open");
  let target=host.querySelector(".modal-actions [data-modal-close]")||host.querySelector("#modalConfirm");
  if(target)target.focus({preventScroll:true});
}
document.addEventListener("click",e=>{
  let host=$("modalHost");if(!host.classList.contains("open"))return;
  if(e.target.closest("[data-modal-close]")){e.preventDefault();closeModal();return}
  if(e.target.closest("#modalConfirm")){e.preventDefault();let cb=confirmCallback;closeModal();if(typeof cb==="function")cb();}
});
document.addEventListener("keydown",e=>{
  let host=$("modalHost");if(!host||!host.classList.contains("open"))return;
  if(e.key==="Escape"){e.preventDefault();closeModal();return}
  if(e.key==="Tab"){
    let f=Array.from(host.querySelectorAll("button:not([disabled])"));if(!f.length)return;
    let first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
  }
});

function go(t){
  if(!PAGES[t])t="home";
  if(PAGES[tab]&&t!==tab)previousTab=tab;
  closeModal();tab=t;render();
  window.scrollTo({top:0,behavior:reducedMotion.matches?"auto":"smooth"});
  let h=$("app").querySelector(".page-title");
  if(h){h.setAttribute("tabindex","-1");h.focus({preventScroll:true})}
}
function backTarget(){return previousTab&&previousTab!==tab&&PAGES[previousTab]?previousTab:"home"}

  add(S.wall,"Memória","memories",x=>x.t||"Uma lembrança",x=>x.d||"");

function calendar(){
  let y=ym.getFullYear(),m=ym.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),today=iso(new Date());

  h+='<section class="card"><div class="calendar-head">'+
      '<button class="icon-btn small" onclick="changeMonth(-1)" aria-label="Mês anterior">‹</button>'+
      '<div class="month-label"><div class="eyebrow">MÊS</div><b>'+label+'</b></div>'+
      '<button class="icon-btn small" onclick="changeMonth(1)" aria-label="Próximo mês">›</button></div><div class="calendar">';

  for(let i=0;i<first;i++)h+='<div class="blank" aria-hidden="true"></div>';

    h+='<button class="day '+(k===today?"today":"")+' '+(k===selectedDate?"selected":"")+' '+(has?"has-event":"")+'" onclick="selectDate(\''+k+'\')" aria-label="Dia '+d+(has?" com compromisso":"")+'" aria-pressed="'+(k===selectedDate?"true":"false")+'">'+d+'</button>';
  }
  h+='</div></section>';

  let events=S.events.map((e,i)=>({...e,i})).filter(e=>e.d===selectedDate);
  if(events.length)events.forEach(e=>{h+='<div class="list-item"><div class="list-main"><b>'+esc(e.t)+'</b><small>'+esc(e.time||"Sem horário")+' · '+esc(e.by||"Nosso evento")+'</small></div><button class="btn ghost small" onclick="removeItem(\'events\','+e.i+')" aria-label="Excluir compromisso '+esc(e.t)+'">Excluir</button></div>'});
  else h+='<p class="muted">Nenhum compromisso neste dia.</p>';

}

function addMemory(){
  let t=$("memoryTitle").value.trim(),text=$("memoryText").value.trim(),f=$("memoryFile").files[0];
  if(!t&&!text&&!f)return notify("Adicione um título, texto ou fotografia.");
  const done=img=>{S.wall.push({t:t||"Uma lembrança",text,img,d:new Date().toLocaleDateString("pt-BR")});save();render();notify("Memória guardada.")};
  if(!f)return done("");
  if(f.size>12*1024*1024)return notify("Escolha uma imagem menor que 12 MB.");
  notify("Processando imagem…");
  let r=new FileReader();
  r.onerror=()=>notify("Não foi possível ler a imagem.");
  r.onload=()=>{
    let im=new Image();
    im.onerror=()=>notify("Não foi possível abrir a imagem.");
    im.onload=()=>{
      try{
        let scale=Math.min(1,1000/im.width,1000/im.height),c=document.createElement("canvas");
        c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);
        c.getContext("2d").drawImage(im,0,0,c.width,c.height);
        done(c.toDataURL("image/jpeg",.78));
      }catch(e){notify("Não foi possível processar a imagem.")}
    };
    im.src=r.result;
  };
  r.readAsDataURL(f);
}

  h+='<section class="card"><span class="pill">PERGUNTA DO DIA</span><h2 style="margin:12px 0 10px">'+esc(dailyQuestion())+'</h2>'+
      '<label for="answerText">Sua resposta</label><textarea id="answerText" placeholder="Escreva sua resposta..."></textarea>'+
      '<label for="answerBy">Seu nome</label><input id="answerBy" value="'+esc(S.n1||"")+'" placeholder="Seu nome">'+
      '<button class="btn full" onclick="addAnswer()">Salvar minha resposta</button></section>';
  if(todayAnswers.length){
    h+='<div class="section-head"><h2>Respostas de hoje</h2></div><section class="card">';
    todayAnswers.forEach(a=>{h+='<div class="letter"><p>'+esc(a.text)+'</p><small>— '+esc(a.by)+'</small></div>'});
    h+='</section>';
  }
  h+='<section class="card"><div class="card-head"><h2>Desafio a dois</h2><span aria-hidden="true">✦</span></div><p>'+esc(challengeOfDay())+'</p>'+
      '<button class="btn secondary small" onclick="completeChallenge()">Marcar como realizado</button>'+
      '<p class="muted" style="margin:10px 0 0">'+(S.challenges.includes(iso(new Date()))?"Desafio de hoje concluído! ✓":"Um pequeno convite para hoje.")+'</p></section>';
  h+='<section class="card"><h2>Quiz do casal</h2><p class="muted">Uma pergunta para cada um responder e comparar depois, pessoalmente.</p><p><b>Qual seria o passeio perfeito para vocês?</b></p>'+
      '<div class="actions"><button class="btn secondary small" onclick="notify(\'Boa ideia! Guardem as respostas e comparem juntos.\')">Pensar na resposta</button>'+
      '<button class="btn ghost small" onclick="newQuiz()">Outra pergunta</button></div><p id="quizQuestion" class="muted" style="margin:10px 0 0">Toque para revelar outra pergunta.</p></section>';
  return h;
}
function completeChallenge(){if(!S.challenges.includes(iso(new Date()))){S.challenges.push(iso(new Date()));save();render();notify("Desafio registrado!")}else notify("Vocês já registraram o desafio de hoje.")}
function addAnswer(){let t=$("answerText").value.trim();if(!t)return notify("Escreva sua resposta.");S.answers.push({day:iso(new Date()),text:t,by:$("answerBy").value.trim()||"Um de nós"});save();render();notify("Resposta guardada.")}
function newQuiz(){let q=["Qual viagem combina com vocês neste momento?","Qual comida vocês escolheriam para um jantar especial?","Que habilidade gostariam de aprender juntos?","Qual lembrança merece virar tradição?","Como seria um domingo perfeito a dois?"];$("quizQuestion").textContent=q[Math.floor(Math.random()*q.length)]}

function journal(){
  let h=header("UM REGISTRO DOS NOSSOS DIAS","Diário compartilhado","Um espaço para registrar como foi o dia e o que vale lembrar.",'<span class="pill">'+S.journal.length+' '+(S.journal.length===1?"registro":"registros")+'</span>',backTarget());
  h+='<section class="card"><h2>Novo registro</h2><label for="journalTitle">Título do dia</label><input id="journalTitle" placeholder="Ex.: um dia simples e bom">'+
      '<label for="journalBy">Quem está escrevendo?</label><input id="journalBy" value="'+esc(S.n1||"")+'" placeholder="Seu nome">'+
      '<label for="journalText">O que aconteceu?</label><textarea id="journalText" placeholder="O que vale lembrar deste dia?"></textarea>'+
      '<button class="btn full" onclick="addJournal()">Salvar no diário</button></section>';
  if(!S.journal.length)h+='<div class="empty"><div class="big">📖</div><b>Uma página em branco</b><p class="muted">Registrem aqui os detalhes do cotidiano.</p></div>';
  S.journal.slice().reverse().forEach((j,rev)=>{let i=S.journal.length-1-rev;h+='<section class="card"><div class="row"><h3 style="margin:0">'+esc(j.t)+'</h3><button class="btn ghost small" onclick="removeItem(\'journal\','+i+')" aria-label="Excluir registro '+esc(j.t)+'">Excluir</button></div>'+
    '<p class="muted" style="margin:6px 0 10px">'+esc(j.d)+' · '+esc(j.by)+'</p><p style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(j.text)+'</p></section>'});
  return h;
}
function addJournal(){let t=$("journalText").value.trim();if(!t)return notify("Escreva alguma coisa antes de salvar.");S.journal.push({t:$("journalTitle").value.trim()||"Um dia nosso",by:$("journalBy").value.trim()||"Nós",text:t,d:new Date().toLocaleDateString("pt-BR")});save();render();notify("Registro salvo.")}

function music(){
  let h=header("A TRILHA SONORA DE VOCÊS","Nossas músicas","Músicas que lembram pessoas, lugares e momentos.",'<span class="pill">'+S.music.length+' '+(S.music.length===1?"música":"músicas")+'</span>',backTarget());
  h+='<section class="card"><h2>Adicionar música</h2><div class="form-row"><div><label for="musicName">Nome da música</label><input id="musicName" placeholder="Nome da música"></div><div><label for="musicArtist">Artista</label><input id="musicArtist" placeholder="Artista"></div></div>'+
      '<label for="musicLink">Link (opcional)</label><input id="musicLink" type="url" placeholder="Spotify, YouTube etc.">'+
      '<label for="musicMeaning">Por que é especial?</label><textarea id="musicMeaning" placeholder="Conte a história dessa música..."></textarea>'+
      '<button class="btn full" onclick="addMusic()">Adicionar à coleção</button></section>';
  if(!S.music.length)h+='<div class="empty"><div class="big">♫</div><b>Qual é a música de vocês?</b><p class="muted">Guardem aqui as que têm significado.</p></div>';
  S.music.forEach((m,i)=>{h+='<section class="card"><div class="row"><div><h3 style="margin-bottom:4px">'+esc(m.name)+'</h3><p class="muted" style="margin:0">'+esc(m.artist)+'</p></div>'+
    '<button class="btn ghost small" onclick="removeItem(\'music\','+i+')" aria-label="Excluir música '+esc(m.name)+'">Excluir</button></div>'+
    (m.meaning?'<p style="margin:12px 0 6px">'+esc(m.meaning)+'</p>':"")+(m.link?'<a href="'+esc(m.link)+'" target="_blank" rel="noopener noreferrer">Abrir música ↗</a>':"")+'</section>'});
  return h;
}
function addMusic(){
  let name=$("musicName").value.trim();if(!name)return notify("Informe o nome da música.");
  let link=$("musicLink").value.trim();if(link&&!/^https?:\/\//i.test(link))return notify("Informe um link iniciado por http:// ou https://.");
  S.music.push({name,artist:$("musicArtist").value.trim(),link,meaning:$("musicMeaning").value.trim()});save();render();notify("Música adicionada.");
}

function places(){
  let h=header("LUGARES QUE FAZEM PARTE DA HISTÓRIA","Mapa de memórias","Guardem os lugares especiais e abram a localização no mapa.",'<span class="pill">'+S.places.length+' '+(S.places.length===1?"lugar":"lugares")+'</span>',backTarget());
  h+='<section class="card"><h2>Novo lugar</h2><div class="form-row"><div><label for="placeName">Nome do lugar</label><input id="placeName" placeholder="Ex.: praia, café, praça"></div><div><label for="placeDate">Data (opcional)</label><input id="placeDate" type="date"></div></div>'+
      '<label for="placeAddress">Endereço ou cidade</label><input id="placeAddress" placeholder="Endereço ou cidade">'+
      '<label for="placeNote">O que aconteceu aqui?</label><textarea id="placeNote" style="min-height:70px" placeholder="Conte a memória desse lugar..."></textarea>'+
      '<button class="btn full" onclick="addPlace()">Guardar lugar</button></section>';
  if(!S.places.length)h+='<div class="empty"><div class="big">⌖</div><b>Um mapa feito de lembranças</b><p class="muted">Adicione o primeiro lugar especial.</p></div>';
  S.places.forEach((p,i)=>{h+='<section class="card"><div class="row"><h3 style="margin-bottom:4px">'+esc(p.name)+'</h3><button class="btn ghost small" onclick="removeItem(\'places\','+i+')" aria-label="Excluir lugar '+esc(p.name)+'">Excluir</button></div>'+
    '<p class="muted" style="margin:0 0 10px">'+esc(p.address)+(p.date?' · '+fmtDate(p.date):"")+'</p>'+(p.note?'<p>'+esc(p.note)+'</p>':"")+
    '<a target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.address)+'">Ver localização ↗</a></section>'});
  return h;
}
function addPlace(){let name=$("placeName").value.trim(),address=$("placeAddress").value.trim();if(!name||!address)return notify("Informe o nome e a localização.");S.places.push({name,address,date:$("placeDate").value,note:$("placeNote").value.trim()});save();render();notify("Lugar guardado.")}

function more(){
  let h=header("NOSSO UNIVERSO, EM CADA DETALHE","Mais espaços","Outras formas de guardar, planejar e celebrar a história de vocês.",'<span class="pill">✦ 6 espaços</span>');
  h+='<div class="section-head"><h2>Coleções</h2></div><div class="grid">'+
      '<button class="tile" onclick="go(\'plans\')"><span class="emoji" aria-hidden="true">✦</span><b>Nossos planos</b><small>Ideias para viver juntos</small></button>'+
      '<button class="tile" onclick="go(\'letters\')"><span class="emoji" aria-hidden="true">✉</span><b>Cartinhas</b><small>Mensagens especiais</small></button>'+
      '<button class="tile" onclick="go(\'journal\')"><span class="emoji" aria-hidden="true">📖</span><b>Diário</b><small>Registros do cotidiano</small></button>'+
      '<button class="tile" onclick="go(\'music\')"><span class="emoji" aria-hidden="true">♫</span><b>Nossas músicas</b><small>A trilha sonora de vocês</small></button>'+
      '<button class="tile" onclick="go(\'places\')"><span class="emoji" aria-hidden="true">⌖</span><b>Mapa de memórias</b><small>Lugares especiais</small></button></div>';
  h+='<div class="section-head"><h2>Preferências</h2></div><div class="grid">'+
      '<button class="tile" onclick="go(\'settings\')"><span class="emoji" aria-hidden="true">⚙</span><b>Configurações</b><small>Perfil, tema e backup</small></button></div>';
  return h;
}

function settings(){
  let h=header("PREFERÊNCIAS","Configurações","Personalizem o espaço de vocês.",'<span class="pill">✦ US</span>',backTarget());
  h+='<section class="card"><h2>Perfil do casal</h2><label for="cfgN1">Seu nome</label><input id="cfgN1" value="'+esc(S.n1)+'" placeholder="Seu nome">'+
      '<label for="cfgN2">Nome da outra pessoa</label><input id="cfgN2" value="'+esc(S.n2)+'" placeholder="Nome da pessoa">'+
      '<label for="cfgSince">Data de início do relacionamento</label><input id="cfgSince" type="date" value="'+esc(S.since)+'">'+
      '<button class="btn full" onclick="saveProfile()">Salvar perfil</button></section>';
  h+='<section class="card"><h2>Aparência</h2><p class="muted">Escolha como prefere visualizar o US. O modo automático acompanha o aparelho.</p>'+
      '<div class="segmented" role="group" aria-label="Tema do aplicativo">'+
      '<button class="btn secondary theme-option" data-theme-option="light" onclick="setTheme(\'light\')" aria-pressed="false">☀ Claro</button>'+
      '<button class="btn secondary theme-option" data-theme-option="dark" onclick="setTheme(\'dark\')" aria-pressed="false">☾ Escuro</button>'+
      '<button class="btn secondary theme-option" data-theme-option="system" onclick="setTheme(\'system\')" aria-pressed="false">◐ Automático</button>'+
      '</div></section>';
  h+='<section class="card"><h2>Seus dados</h2><p class="muted">As informações ficam armazenadas localmente neste navegador. Exporte uma cópia de segurança antes de trocar de aparelho ou limpar os dados do navegador.</p>'+
      '<div class="actions"><button class="btn secondary" onclick="exportData()">Exportar backup</button>'+
      '<label class="btn ghost" for="backupFile">Importar backup</label><input id="backupFile" type="file" accept="application/json" style="position:absolute;width:1px;height:1px;opacity:0" onchange="importData(event)"></div>'+
      '<hr><button class="btn danger small" onclick="clearData()">Apagar dados deste aparelho</button></section>';
  h+='<p class="small-note" style="text-align:center;margin:18px 0 0">US · Our Universe · Feito para guardar o que importa.</p>';
  return h;
}
function saveProfile(){S.n1=$("cfgN1").value.trim();S.n2=$("cfgN2").value.trim();S.since=$("cfgSince").value;save();render();notify("Perfil atualizado.")}
function exportData(){let blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="us-backup.json";a.click();URL.revokeObjectURL(url);notify("Backup preparado.")}
function importData(ev){
  let f=ev.target.files[0];if(!f)return;
  let r=new FileReader();
  r.onload=()=>{
    try{
      let d=JSON.parse(r.result);if(!d||typeof d!=="object"||Array.isArray(d))throw 0;
      S={...defaults,...d};
      Object.keys(defaults).forEach(k=>{if(Array.isArray(defaults[k])&&!Array.isArray(S[k]))S[k]=[]});
      if(!["light","dark","system"].includes(S.theme))S.theme="light";
      applyTheme(S.theme);save();render();notify("Backup importado.");
    }catch(e){notify("Não foi possível importar esse arquivo.")}
  };
  r.readAsText(f);
}
function clearData(){
  openModal({
    title:"Apagar dados deste aparelho?",
    description:"Todas as memórias, cartinhas, planos e preferências salvas neste navegador serão removidas. Esta ação não pode ser desfeita.",
    confirmLabel:"Apagar dados",danger:true,
    onConfirm:()=>{localStorage.removeItem(STORAGE_KEY);S={...defaults};applyTheme(S.theme);save();go("home");notify("Dados locais apagados.")}
  });
}
function removeItem(key,i){
  openModal({
    title:"Excluir este registro?",
    description:"O registro será removido deste aparelho. Você pode exportar um backup antes, se quiser.",
    confirmLabel:"Excluir",danger:true,
    onConfirm:()=>{S[key].splice(i,1);save();render();notify("Registro excluído.")}
  });
}
const PAGE_TITLES={home:"Início",calendar:"Agenda",memories:"Memórias",connect:"Conexão",more:"Mais",plans:"Nossos planos",letters:"Cartinhas",journal:"Diário",music:"Nossas músicas",places:"Mapa de memórias",settings:"Configurações"};
function render(){
  nav();
  let app=$("app");
  app.innerHTML=(PAGES[tab]||PAGES.home)();
  app.classList.remove("page-enter");void app.offsetWidth;app.classList.add("page-enter");
  document.title="US · "+(PAGE_TITLES[tab]||"Our Universe");
  syncThemeUI();
}
const PAGES={home,calendar,memories,connect,more,plans,letters,journal,music,places,settings};
applyTheme(S.theme);
render();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
