<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>US · Our Universe</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1769AA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Nosso pequeno universo, compartilhado por duas pessoas.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
 --bg:#f4f8fd;--surface:#fff;--surface2:#edf4fb;--text:#142235;--muted:#718096;
 --blue:#347fbd;--blue2:#e5f1fb;--line:#dce7f1;--shadow:0 12px 32px rgba(29,75,115,.07);
 --good:#27866a;--danger:#c85c66;--radius:22px;color-scheme:light;
}
:root[data-theme="dark"]{--bg:#0d1420;--surface:#151f2d;--surface2:#1c2b3d;--text:#edf4fb;--muted:#a0afbf;--blue:#65b4f0;--blue2:#20364b;--line:#2a3a4c;--shadow:0 12px 32px rgba(0,0,0,.18);color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1420;--surface:#151f2d;--surface2:#1c2b3d;--text:#edf4fb;--muted:#a0afbf;--blue:#65b4f0;--blue2:#20364b;--line:#2a3a4c;--shadow:0 12px 32px rgba(0,0,0,.18);color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 calc(86px + env(safe-area-inset-bottom));}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
#app{max-width:760px;margin:auto;padding:18px 17px 28px;animation:pageIn .28s ease both}
.topline{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.12em}
.brand-mark{width:37px;height:37px;border-radius:13px;background:var(--blue2);display:grid;place-items:center;color:var(--blue);font-size:19px}
.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.2em;font-weight:700;margin-top:-2px}
.icon-btn{width:40px;height:40px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:14px}
h1{font-size:27px;line-height:1.18;margin:0 0 7px;letter-spacing:-.04em}
h2{font-size:19px;margin:0 0 12px;letter-spacing:-.025em}
h3{font-size:15px;margin:0 0 7px}
p{margin:6px 0}
.muted{color:var(--muted);font-size:13px}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.16em;font-weight:800;color:var(--muted);margin-bottom:7px}
.hero{position:relative;overflow:hidden;border-radius:27px;padding:24px;background:linear-gradient(135deg,#185b91,#438fca 65%,#75b6e5);color:white;box-shadow:0 16px 35px rgba(39,111,166,.18);margin:14px 0 18px}
.hero:after{content:"✧";position:absolute;font-size:130px;right:15px;top:-45px;color:#ffffff22;transform:rotate(18deg)}
.hero .eyebrow{color:#d7ebfb}
.hero h1{font-size:32px;max-width:80%}
.counter{display:flex;align-items:baseline;gap:7px;margin:15px 0 3px}
.counter strong{font-size:43px;line-height:1;font-weight:800;letter-spacing:-.05em}
.counter span{font-size:14px;color:#e4f2fc}
.hero-foot{font-size:12px;color:#e4f2fc;margin-top:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:11px 0;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.tile{padding:15px;border:1px solid var(--line);border-radius:19px;background:var(--surface);text-align:left;color:var(--text);min-height:115px;box-shadow:var(--shadow);transition:transform .18s ease,border-color .18s ease}
.tile:active{transform:scale(.98)}
.tile .emoji{font-size:22px;display:block;margin-bottom:12px}
.tile b{display:block;font-size:14px}
.tile small{color:var(--muted);font-size:11px}
.btn{border:0;background:var(--blue);color:white;border-radius:13px;padding:11px 16px;font-weight:700;transition:transform .16s ease,filter .16s ease}
.btn:active{transform:scale(.97)}
.btn.secondary{background:var(--blue2);color:var(--blue)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.danger{background:#fae9eb;color:var(--danger)}
.btn.small{padding:7px 11px;font-size:12px;border-radius:10px}
.btn.full{width:100%}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px 13px;background:var(--bg);color:var(--text);outline:none;margin:5px 0 10px;min-width:0}
input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue2)}
textarea{min-height:100px;resize:vertical}
label{display:block;font-size:12px;color:var(--muted);font-weight:650;margin-top:5px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 9px;background:var(--blue2);color:var(--blue);font-size:11px;font-weight:750}
.list-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-main{min-width:0;flex:1}
.list-main b{display:block;overflow-wrap:anywhere}
.list-main small{display:block;color:var(--muted);font-size:11px}
.empty{text-align:center;padding:25px 12px;color:var(--muted)}
.empty .big{font-size:29px;margin-bottom:7px}
.photo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.memory{overflow:hidden;border:1px solid var(--line);background:var(--surface);border-radius:17px}
.memory img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--surface2)}
.memory-body{padding:10px}
.memory-body b{font-size:13px;display:block}
.memory-body small{font-size:11px;color:var(--muted)}
.letter{border-left:3px solid var(--blue);background:var(--surface2);padding:13px 14px;border-radius:0 14px 14px 0;margin:10px 0}
.calendar-head{display:flex;align-items:center;justify-content:space-between;margin:12px 0}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.calendar div{padding:9px 0;border-radius:11px;font-size:13px}
.calendar .weekday{color:var(--muted);font-size:10px;font-weight:800}
.calendar .day{background:var(--surface2);cursor:pointer}
.calendar .today{outline:2px solid var(--blue)}
.calendar .selected{background:var(--blue);color:#fff}
.calendar .has-event{position:relative}
.calendar .has-event:after{content:"";width:4px;height:4px;border-radius:50%;background:var(--blue);position:absolute;bottom:3px;left:calc(50% - 2px)}
.calendar .selected:after{background:white}
.progress{height:7px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:8px 0}
.progress span{height:100%;display:block;background:var(--blue);border-radius:99px}
nav{position:fixed;z-index:10;bottom:0;left:0;right:0;display:flex;justify-content:center;background:color-mix(in srgb,var(--surface) 93%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:7px 8px calc(7px + env(safe-area-inset-bottom))}
nav button{flex:1;max-width:150px;border:0;background:transparent;color:var(--muted);font-size:10px;font-weight:700;padding:5px 2px;border-radius:12px}
nav button span{display:block;font-size:19px;margin-bottom:2px}
nav button.active{color:var(--blue);background:var(--blue2)}
.toast{position:fixed;z-index:30;left:50%;bottom:100px;transform:translate(-50%,12px);opacity:0;background:var(--text);color:var(--surface);padding:10px 15px;border-radius:12px;font-size:12px;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
hr{border:0;border-top:1px solid var(--line);margin:15px 0}
a{color:var(--blue)}
.small-note{font-size:11px;color:var(--muted)}
@keyframes pageIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@media(min-width:620px){#app{padding:25px 24px 35px}.photo-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{padding:30px}}
@media(max-width:380px){#app{padding:14px 12px}.hero{padding:20px}.hero h1{font-size:27px}.counter strong{font-size:37px}.card{padding:13px}.tile{padding:12px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<nav id="nav" aria-label="Navegação principal"></nav>
<div id="toast" class="toast" role="status"></div>
<script>
"use strict";
const defaults={letters:[],events:[],wall:[],plans:[],journal:[],music:[],places:[],answers:[],challenges:[],theme:"light",n1:"",n2:"",since:"",profile1:"",profile2:""};
let S={...defaults};try{S={...S,...JSON.parse(localStorage.getItem("us")||"{}")}}catch(e){}
["letters","events","wall","plans","journal","music","places","answers","challenges"].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});
let tab="home",subtab="more",ym=new Date(),selectedDate=iso(new Date()),toastTimer;
function $(id){return document.getElementById(id)}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function save(){try{localStorage.setItem("us",JSON.stringify(S))}catch(e){notify("Não foi possível salvar. Talvez o armazenamento esteja cheio.")}}
function notify(msg){let el=$("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),2400)}
function go(t){tab=t;render();window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}
function header(){return `<div class="topline"><div class="brand"><div class="brand-mark">✧</div><div>US<small>OUR UNIVERSE</small></div></div><button class="icon-btn" onclick="go('settings')" aria-label="Configurações">⚙</button></div>`}
const navItems=[["home","⌂","Início"],["calendar","▦","Agenda"],["memories","▧","Memórias"],["connect","♡","Conexão"],["more","•••","Mais"]];
function nav(){ $("nav").innerHTML=navItems.map(([id,ic,label])=>`<button class="${tab===id?"active":""}" onclick="go('${id}')"><span>${ic}</span>${label}</button>`).join("")}
function daysTogether(){if(!S.since)return null;let start=new Date(S.since+"T00:00:00");if(Number.isNaN(start.getTime()))return null;return Math.max(0,Math.floor((Date.now()-start.getTime())/86400000))}
function home(){
 let days=daysTogether(),next=S.events.filter(e=>e.d>=iso(new Date())).sort((a,b)=>a.d.localeCompare(b.d))[0];
 let h=header()+`<div class="eyebrow">NOSSO PEQUENO UNIVERSO</div><h1>Um lugar só nosso.</h1><p class="muted">Pequenos momentos também constroem grandes histórias.</p>`;
 h+=`<section class="hero"><div class="eyebrow">FEITO DE VOCÊ + EU</div><h1>${esc(S.n1||"Você")} <span style="opacity:.75">✦</span> ${esc(S.n2||"Sua pessoa")}</h1>`;
 h+=days!==null?`<div class="counter"><strong>${days}</strong><span>dias juntos</span></div>`:`<p style="margin-top:15px">Configure a data especial de vocês para começar a contar.</p>`;
 h+=`<div class="hero-foot">${S.since?"Desde "+S.since.split("-").reverse().join("/"):"Nosso universo começa aqui."}</div></section>`;
 h+=`<div class="card"><div class="card-head"><div><div class="eyebrow">PRÓXIMO CAPÍTULO</div><h2 style="margin:0">Próximo encontro</h2></div><span class="pill">♡ a dois</span></div>${next?`<b>${esc(next.t)}</b><p class="muted">${next.d.split("-").reverse().join("/")} ${next.time?"· "+esc(next.time):""}</p>`:`<p class="muted">Ainda não há planos na agenda.</p>`}<button class="btn secondary small" onclick="go('calendar')">Abrir agenda</button></div>`;
 h+=`<div class="card"><div class="card-head"><h2 style="margin:0">Nosso resumo</h2><span class="muted">por aqui</span></div><div class="grid"><div><div class="eyebrow">MEMÓRIAS</div><h2>${S.wall.length}</h2></div><div><div class="eyebrow">PLANOS CONCLUÍDOS</div><h2>${S.plans.filter(p=>p.done).length}</h2></div><div><div class="eyebrow">CARTINHAS</div><h2>${S.letters.length}</h2></div><div><div class="eyebrow">DIÁRIO</div><h2>${S.journal.length}</h2></div></div></div>`;
 h+=`<div class="card-head"><h2 style="margin:0">Acessos rápidos</h2></div><div class="grid">
 <button class="tile" onclick="go('memories')"><span class="emoji">📷</span><b>Guardar memória</b><small>Registrar um momento</small></button>
 <button class="tile" onclick="go('plans')"><span class="emoji">✦</span><b>Fazer planos</b><small>O que queremos viver</small></button>
 <button class="tile" onclick="go('letters')"><span class="emoji">✉</span><b>Escrever carta</b><small>Uma mensagem especial</small></button>
 <button class="tile" onclick="go('journal')"><span class="emoji">📖</span><b>Nosso diário</b><small>Como foi o dia?</small></button></div>`;
 h+=`<div class="card"><div class="card-head"><h2 style="margin:0">Uma pergunta para hoje</h2><span>♡</span></div><p>${dailyQuestion()}</p><button class="btn secondary small" onclick="go('connect')">Responder juntos</button></div>`;
 return h;
}
const questions=["Qual lugar você gostaria de conhecer comigo?","Que lembrança nossa sempre faz você sorrir?","Qual seria um dia perfeito para nós dois?","O que você gostaria que fizéssemos mais vezes?","Qual música combina com a nossa história?","Que coisa nova você gostaria de aprender comigo?","Qual pequeno gesto faz você se sentir amado(a)?"];
function dailyQuestion(){return questions[Math.floor(Date.now()/86400000)%questions.length]}
function calendar(){
 let y=ym.getFullYear(),m=ym.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),today=iso(new Date());
 let h=header()+`<div class="eyebrow">TEMPO DE QUALIDADE</div><h1>Nossa agenda</h1><p class="muted">Datas especiais, encontros e planos.</p><div class="card"><div class="calendar-head"><button class="btn secondary small" onclick="changeMonth(-1)">‹</button><b>${ym.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})}</b><button class="btn secondary small" onclick="changeMonth(1)">›</button></div><div class="calendar">`;
 ["D","S","T","Q","Q","S","S"].forEach(x=>h+=`<div class="weekday">${x}</div>`);
 for(let i=0;i<first;i++)h+="<div></div>";
 for(let d=1;d<=n;d++){let k=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`,has=S.events.some(e=>e.d===k);h+=`<div class="day ${k===today?"today":""} ${k===selectedDate?"selected":""} ${has?"has-event":""}" onclick="selectedDate='${k}';render()">${d}</div>`}
 h+=`</div></div><div class="card"><div class="eyebrow">DIA SELECIONADO</div><h2>${selectedDate.split("-").reverse().join("/")}</h2>`;
 let events=S.events.map((e,i)=>({...e,i})).filter(e=>e.d===selectedDate);
 if(events.length)events.forEach(e=>h+=`<div class="list-item"><div class="list-main"><b>${esc(e.t)}</b><small>${esc(e.time||"Sem horário")} · ${esc(e.by||"Nosso evento")}</small></div><button class="btn ghost small" onclick="removeItem('events',${e.i})">Excluir</button></div>`);
 else h+=`<p class="muted">Nenhum compromisso neste dia.</p>`;
 h+=`<hr><h3>Adicionar compromisso</h3><input id="eventTitle" placeholder="Ex.: jantar, cinema, aniversário"><div class="form-row"><input id="eventTime" type="time" aria-label="Horário"><input id="eventBy" placeholder="Responsável (opcional)"></div><button class="btn full" onclick="addEvent()">Salvar na agenda</button></div>`;
 return h;
}
function changeMonth(n){ym=new Date(ym.getFullYear(),ym.getMonth()+n,1);render()}
function addEvent(){let t=$("eventTitle").value.trim();if(!t)return notify("Escreva o nome do compromisso.");S.events.push({d:selectedDate,t,time:$("eventTime").value,by:$("eventBy").value.trim()});save();render();notify("Compromisso adicionado.")}
function memories(){
 let h=header()+`<div class="eyebrow">PEQUENOS INSTANTES, GRANDES HISTÓRIAS</div><h1>Nossas memórias</h1><p class="muted">Um álbum dos momentos que queremos guardar.</p><div class="card"><h2>Adicionar memória</h2><input id="memoryTitle" placeholder="Dê um nome para esse momento"><textarea id="memoryText" placeholder="Conte um pouquinho sobre ele..."></textarea><label>Fotografia (opcional)</label><input id="memoryFile" type="file" accept="image/*"><button class="btn full" onclick="addMemory()">Guardar memória</button><p class="small-note">As imagens são reduzidas antes de serem salvas para economizar espaço.</p></div>`;
 if(!S.wall.length)h+=`<div class="empty"><div class="big">✧</div><b>O álbum de vocês começa aqui</b><p class="muted">Adicione a primeira lembrança.</p></div>`;
 else{h+=`<div class="photo-grid">`;S.wall.slice().reverse().forEach((w,rev)=>{let i=S.wall.length-1-rev;h+=`<article class="memory">${w.img?`<img src="${w.img}" alt="${esc(w.t)}">`:`<div style="aspect-ratio:4/3;display:grid;place-items:center;background:var(--surface2);font-size:30px">✧</div>`}<div class="memory-body"><b>${esc(w.t)}</b>${w.text?`<p class="muted">${esc(w.text)}</p>`:""}<small>${esc(w.d||"")}</small><div style="margin-top:8px"><button class="btn ghost small" onclick="removeItem('wall',${i})">Excluir</button></div></div></article>`});h+=`</div>`}
 h+=`<div class="card"><h3>Linha do tempo</h3><p class="muted">Vocês podem revisitar os registros em ordem cronológica no álbum.</p></div>`;
 return h;
}
function addMemory(){let t=$("memoryTitle").value.trim(),text=$("memoryText").value.trim(),f=$("memoryFile").files[0];if(!t&&!text&&!f)return notify("Adicione um título, texto ou fotografia.");const done=img=>{S.wall.push({t:t||"Uma lembrança",text,img,d:new Date().toLocaleDateString("pt-BR")});save();render();notify("Memória guardada.")};if(!f)return done("");if(f.size>12*1024*1024)return notify("Escolha uma imagem menor que 12 MB.");let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let scale=Math.min(1,1000/im.width,1000/im.height),c=document.createElement("canvas");c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext("2d").drawImage(im,0,0,c.width,c.height);done(c.toDataURL("image/jpeg",.78))};im.src=r.result};r.readAsDataURL(f)}
function plans(){
 let h=header()+`<div class="eyebrow">COISAS QUE QUEREMOS VIVER</div><h1>Nossos planos</h1><p class="muted">Uma lista de ideias, desejos e experiências para fazer a dois.</p><div class="card"><h2>Novo plano</h2><input id="planTitle" placeholder="O que queremos fazer?"><div class="form-row"><select id="planCategory"><option>Lugares</option><option>Filmes e séries</option><option>Comidas</option><option>Viagens</option><option>Experiências</option><option>Outros</option></select><select id="planPriority"><option>Quando der</option><option>Prioridade</option><option>Em breve</option></select></div><textarea id="planNote" placeholder="Detalhes (opcional)" style="min-height:65px"></textarea><button class="btn full" onclick="addPlan()">Adicionar à lista</button></div>`;
 if(!S.plans.length)h+=`<div class="empty"><div class="big">✦</div><b>O que vocês querem viver juntos?</b><p class="muted">Comecem adicionando uma ideia.</p></div>`;
 else{let done=S.plans.filter(p=>p.done).length;h+=`<div class="card"><div class="row"><b>Progresso dos planos</b><span class="pill">${done}/${S.plans.length}</span></div><div class="progress"><span style="width:${done/S.plans.length*100}%"></span></div></div>`;S.plans.forEach((p,i)=>h+=`<div class="card flat"><div class="row"><div class="list-main"><b style="${p.done?"text-decoration:line-through;color:var(--muted)":""}">${esc(p.t)}</b><small>${esc(p.cat)} · ${esc(p.priority)}</small>${p.note?`<small>${esc(p.note)}</small>`:""}</div><button class="btn ${p.done?"secondary":"ghost"} small" onclick="togglePlan(${i})">${p.done?"Feito ✓":"Concluir"}</button></div><div style="text-align:right;margin-top:6px"><button class="btn ghost small" onclick="removeItem('plans',${i})">Excluir</button></div></div>`)}
 return h;
}
function addPlan(){let t=$("planTitle").value.trim();if(!t)return notify("Dê um nome para o plano.");S.plans.push({t,cat:$("planCategory").value,priority:$("planPriority").value,note:$("planNote").value.trim(),done:false});save();render();notify("Plano adicionado.")}
function togglePlan(i){S.plans[i].done=!S.plans[i].done;save();render()}
function letters(){
 let h=header()+`<div class="eyebrow">PALAVRAS QUE FICAM</div><h1>Cartinhas</h1><p class="muted">Mensagens para guardar, reler e abrir no momento certo.</p><div class="card"><h2>Escrever uma cartinha</h2><input id="letterTitle" placeholder="Título da cartinha"><input id="letterFrom" placeholder="De quem?" value="${esc(S.n1||"")}"><label>Mensagem</label><textarea id="letterBody" placeholder="Escreva com carinho..."></textarea><label>Quando poderá ser aberta?</label><input id="letterDate" type="date" min="${iso(new Date())}"><button class="btn full" onclick="addLetter()">Guardar cartinha</button></div>`;
 if(!S.letters.length)h+=`<div class="empty"><div class="big">✉</div><b>Nenhuma cartinha por enquanto</b><p class="muted">Escreva a primeira mensagem especial.</p></div>`;
 S.letters.slice().reverse().forEach((l,rev)=>{let i=S.letters.length-1-rev,locked=l.unlock&&l.unlock>iso(new Date());h+=`<div class="card"><div class="row"><div><span class="pill">${locked?"🔒 Guardada para o futuro":"💌 Disponível"}</span><h3 style="margin-top:9px">${esc(l.t)}</h3></div><button class="btn ghost small" onclick="removeItem('letters',${i})">Excluir</button></div>${locked?`<p class="muted">Esta cartinha poderá ser aberta em ${l.unlock.split("-").reverse().join("/")}.</p>`:`<div class="letter"><p style="white-space:pre-wrap">${esc(l.b)}</p><small>— ${esc(l.f)} · ${esc(l.d)}</small></div>`}</div>`});
 return h;
}
function addLetter(){let b=$("letterBody").value.trim();if(!b)return notify("Escreva a mensagem da cartinha.");let unlock=$("letterDate").value;if(unlock&&unlock<iso(new Date()))return notify("Escolha uma data futura.");S.letters.push({t:$("letterTitle").value.trim()||"Uma cartinha",f:$("letterFrom").value.trim()||"Com carinho",b,d:new Date().toLocaleDateString("pt-BR"),unlock});save();render();notify("Cartinha guardada.")}
function connect(){
 let h=header()+`<div class="eyebrow">UM JEITO DE SE CONHECER SEMPRE MAIS</div><h1>Nossa conexão</h1><p class="muted">Perguntas, descobertas e pequenos desafios para fazer juntos.</p><div class="card"><span class="pill">PERGUNTA DO DIA</span><h2 style="margin-top:12px">${dailyQuestion()}</h2><textarea id="answerText" placeholder="Escreva sua resposta..."></textarea><input id="answerBy" placeholder="Seu nome" value="${esc(S.n1||"")}"><button class="btn full" onclick="addAnswer()">Salvar minha resposta</button></div>`;
 let todayAnswers=S.answers.filter(a=>a.day===iso(new Date()));if(todayAnswers.length){h+=`<div class="card"><h3>Respostas de hoje</h3>`;todayAnswers.forEach(a=>h+=`<div class="letter"><p>${esc(a.text)}</p><small>— ${esc(a.by)}</small></div>`);h+=`</div>`}
 h+=`<div class="card"><div class="card-head"><h2 style="margin:0">Desafio a dois</h2><span>✦</span></div><p>${challengeOfDay()}</p><button class="btn secondary small" onclick="completeChallenge()">Marcar como realizado</button><p class="muted">${S.challenges.includes(iso(new Date()))?"Desafio de hoje concluído! ✓":"Um pequeno convite para hoje."}</p></div>`;
 h+=`<div class="card"><h2>Quiz do casal</h2><p class="muted">Uma pergunta para cada um responder e comparar depois, pessoalmente.</p><p><b>Qual seria o passeio perfeito para vocês?</b></p><div class="actions"><button class="btn secondary small" onclick="notify('Boa ideia! Guardem as respostas e comparem juntos.')">Pensar na resposta</button><button class="btn ghost small" onclick="newQuiz()">Outra pergunta</button></div><p id="quizQuestion" class="muted"></p></div>`;
 return h;
}
function challengeOfDay(){const c=["Escolham uma música que lembre vocês e contem o motivo.","Separem alguns minutos para relembrar um momento feliz.","Planejem juntos um passeio simples para os próximos dias.","Cada um diga uma coisa que admira no outro.","Escolham uma foto antiga e contem a história por trás dela."];return c[Math.floor(Date.now()/86400000)%c.length]}
function completeChallenge(){if(!S.challenges.includes(iso(new Date()))){S.challenges.push(iso(new Date()));save();render();notify("Desafio registrado!")}else notify("Vocês já registraram o desafio de hoje.")}
function addAnswer(){let t=$("answerText").value.trim();if(!t)return notify("Escreva sua resposta.");S.answers.push({day:iso(new Date()),text:t,by:$("answerBy").value.trim()||"Um de nós"});save();render();notify("Resposta guardada.")}
function newQuiz(){let q=["Qual viagem combina com vocês neste momento?","Qual comida vocês escolheriam para um jantar especial?","Que habilidade gostariam de aprender juntos?","Qual lembrança merece virar tradição?","Como seria um domingo perfeito a dois?"];$("quizQuestion").textContent=q[Math.floor(Math.random()*q.length)]}
function journal(){
 let h=header()+`<div class="eyebrow">UM REGISTRO DOS NOSSOS DIAS</div><h1>Diário compartilhado</h1><p class="muted">Um espaço para registrar como foi o dia e o que vale lembrar.</p><div class="card"><h2>Novo registro</h2><input id="journalTitle" placeholder="Título do dia"><input id="journalBy" placeholder="Quem está escrevendo?" value="${esc(S.n1||"")}"><textarea id="journalText" placeholder="O que aconteceu hoje?"></textarea><button class="btn full" onclick="addJournal()">Salvar no diário</button></div>`;
 if(!S.journal.length)h+=`<div class="empty"><div class="big">📖</div><b>Uma página em branco</b><p class="muted">Registrem aqui os detalhes do cotidiano.</p></div>`;
 S.journal.slice().reverse().forEach((j,rev)=>{let i=S.journal.length-1-rev;h+=`<div class="card"><div class="row"><h3>${esc(j.t)}</h3><button class="btn ghost small" onclick="removeItem('journal',${i})">Excluir</button></div><p class="muted">${esc(j.d)} · ${esc(j.by)}</p><p style="white-space:pre-wrap">${esc(j.text)}</p></div>`});
 return h;
}
function addJournal(){let t=$("journalText").value.trim();if(!t)return notify("Escreva alguma coisa antes de salvar.");S.journal.push({t:$("journalTitle").value.trim()||"Um dia nosso",by:$("journalBy").value.trim()||"Nós",text:t,d:new Date().toLocaleDateString("pt-BR")});save();render();notify("Registro salvo.")}
function music(){
 let h=header()+`<div class="eyebrow">A TRILHA SONORA DE VOCÊS</div><h1>Nossas músicas</h1><p class="muted">Músicas que lembram pessoas, lugares e momentos.</p><div class="card"><h2>Adicionar música</h2><input id="musicName" placeholder="Nome da música"><input id="musicArtist" placeholder="Artista"><input id="musicLink" type="url" placeholder="Link (Spotify, YouTube etc.)"><textarea id="musicMeaning" placeholder="Por que ela é especial?"></textarea><button class="btn full" onclick="addMusic()">Adicionar à coleção</button></div>`;
 if(!S.music.length)h+=`<div class="empty"><div class="big">♫</div><b>Qual é a música de vocês?</b><p class="muted">Guardem aqui as que têm significado.</p></div>`;
 S.music.forEach((m,i)=>h+=`<div class="card"><div class="row"><div><h3>${esc(m.name)}</h3><p class="muted">${esc(m.artist)}</p></div><button class="btn ghost small" onclick="removeItem('music',${i})">Excluir</button></div>${m.meaning?`<p>${esc(m.meaning)}</p>`:""}${m.link?`<a href="${esc(m.link)}" target="_blank" rel="noopener noreferrer">Abrir música ↗</a>`:""}</div>`);
 return h;
}
function addMusic(){let name=$("musicName").value.trim();if(!name)return notify("Informe o nome da música.");let link=$("musicLink").value.trim();if(link&&!/^https?:\/\//i.test(link))return notify("Informe um link iniciado por http:// ou https://.");S.music.push({name,artist:$("musicArtist").value.trim(),link,meaning:$("musicMeaning").value.trim()});save();render();notify("Música adicionada.")}
function places(){
 let h=header()+`<div class="eyebrow">LUGARES QUE FAZEM PARTE DA HISTÓRIA</div><h1>Mapa de memórias</h1><p class="muted">Guardem os lugares especiais e abram a localização no mapa.</p><div class="card"><h2>Novo lugar</h2><input id="placeName" placeholder="Nome do lugar"><input id="placeAddress" placeholder="Endereço ou cidade"><input id="placeDate" type="date"><textarea id="placeNote" placeholder="O que aconteceu aqui?" style="min-height:70px"></textarea><button class="btn full" onclick="addPlace()">Guardar lugar</button></div>`;
 if(!S.places.length)h+=`<div class="empty"><div class="big">⌖</div><b>Um mapa feito de lembranças</b><p class="muted">Adicione o primeiro lugar especial.</p></div>`;
 S.places.forEach((p,i)=>h+=`<div class="card"><div class="row"><h3>${esc(p.name)}</h3><button class="btn ghost small" onclick="removeItem('places',${i})">Excluir</button></div><p class="muted">${esc(p.address)} ${p.date?"· "+p.date.split("-").reverse().join("/"):""}</p>${p.note?`<p>${esc(p.note)}</p>`:""}<a target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.address)}">Ver localização ↗</a></div>`);
 return h;
}
function addPlace(){let name=$("placeName").value.trim(),address=$("placeAddress").value.trim();if(!name||!address)return notify("Informe o nome e a localização.");S.places.push({name,address,date:$("placeDate").value,note:$("placeNote").value.trim()});save();render();notify("Lugar guardado.")}
function more(){
 let h=header()+`<div class="eyebrow">NOSSO UNIVERSO, EM CADA DETALHE</div><h1>Mais espaços</h1><p class="muted">Outras formas de guardar, planejar e celebrar a história de vocês.</p><div class="grid">
 <button class="tile" onclick="go('plans')"><span class="emoji">✦</span><b>Nossos planos</b><small>Ideias para viver juntos</small></button>
 <button class="tile" onclick="go('letters')"><span class="emoji">✉</span><b>Cartinhas</b><small>Mensagens especiais</small></button>
 <button class="tile" onclick="go('journal')"><span class="emoji">📖</span><b>Diário</b><small>Registros do cotidiano</small></button>
 <button class="tile" onclick="go('music')"><span class="emoji">♫</span><b>Nossas músicas</b><small>A trilha sonora de vocês</small></button>
 <button class="tile" onclick="go('places')"><span class="emoji">⌖</span><b>Mapa de memórias</b><small>Lugares especiais</small></button>
 <button class="tile" onclick="go('settings')"><span class="emoji">⚙</span><b>Configurações</b><small>Perfil e preferências</small></button></div>`;
 return h;
}
function settings(){
 let h=header()+`<div class="eyebrow">PREFERÊNCIAS</div><h1>Configurações</h1><p class="muted">Personalizem o espaço de vocês.</p><div class="card"><h2>Perfil do casal</h2><label>Seu nome</label><input id="cfgN1" value="${esc(S.n1)}" placeholder="Seu nome"><label>Nome da outra pessoa</label><input id="cfgN2" value="${esc(S.n2)}" placeholder="Nome da pessoa"><label>Data de início do relacionamento</label><input id="cfgSince" type="date" value="${esc(S.since)}"><button class="btn full" onclick="saveProfile()">Salvar perfil</button></div>`;
 h+=`<div class="card"><h2>Aparência</h2><p class="muted">Escolha como prefere visualizar o US.</p><div class="actions"><button class="btn ${S.theme!=="dark"?"":"secondary"}" onclick="setTheme('light')">☀ Claro</button><button class="btn ${S.theme==="dark"?"":"secondary"}" onclick="setTheme('dark')">☾ Escuro</button><button class="btn secondary" onclick="setTheme('system')">Automático</button></div></div>`;
 h+=`<div class="card"><h2>Seus dados</h2><p class="muted">Nesta versão, as informações ficam armazenadas localmente neste navegador. Exporte uma cópia de segurança antes de trocar de aparelho ou limpar os dados do navegador.</p><div class="actions"><button class="btn secondary" onclick="exportData()">Exportar backup</button><label class="btn ghost" style="display:inline-block;margin:0">Importar backup<input type="file" accept="application/json" style="display:none" onchange="importData(event)"></label></div><hr><button class="btn danger small" onclick="clearData()">Apagar dados deste aparelho</button></div>`;
 h+=`<p class="small-note" style="text-align:center">US · Our Universe · Feito para guardar o que importa.</p>`;
 return h;
}
function saveProfile(){S.n1=$("cfgN1").value.trim();S.n2=$("cfgN2").value.trim();S.since=$("cfgSince").value;save();render();notify("Perfil atualizado.")}
function setTheme(t){S.theme=t;document.documentElement.setAttribute("data-theme",t==="system"?"":t);save();render()}
function exportData(){let blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="us-backup.json";a.click();URL.revokeObjectURL(url);notify("Backup preparado.")}
function importData(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d||typeof d!=="object"||Array.isArray(d))throw 0;S={...defaults,...d};Object.keys(defaults).forEach(k=>{if(Array.isArray(defaults[k])&&!Array.isArray(S[k]))S[k]=[]});save();render();notify("Backup importado.")}catch(e){notify("Não foi possível importar esse arquivo.")}};r.readAsText(f)}
function clearData(){if(!confirm("Isso apagará os dados salvos neste aparelho. Exporte um backup antes. Deseja continuar?"))return;localStorage.removeItem("us");S={...defaults};save();go("home");notify("Dados locais apagados.")}
function removeItem(key,i){if(!confirm("Deseja excluir este registro?"))return;S[key].splice(i,1);save();render();notify("Registro excluído.")}
function render(){
 nav();let pages={home,calendar,memories,connect,more,plans,letters,journal,music,places,settings};
 $("app").innerHTML=(pages[tab]||home)();
}
if(S.theme==="dark")document.documentElement.setAttribute("data-theme","dark");else if(S.theme==="light")document.documentElement.setAttribute("data-theme","light");
render();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
