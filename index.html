<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>US · Our Universe</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1769AA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#f4f8fc;--card:#fff;--tx:#111318;--mu:#5d6b7a;--bl:#1769AA;--bl2:#e3f0fb;--ln:#d9e6f2;--rad:16px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1118;--card:#171d27;--tx:#f2f6fa;--mu:#9aa9ba;--bl:#4aa3e8;--bl2:#16273a;--ln:#26324280;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1118;--card:#171d27;--tx:#f2f6fa;--mu:#9aa9ba;--bl:#4aa3e8;--bl2:#16273a;--ln:#263242;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:96px}
main{max-width:640px;margin:0 auto;padding:16px;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
h1,h2{margin:0 0 12px;font-weight:700}h2{font-size:20px}
.hero{background:linear-gradient(135deg,#1769AA,#4aa3e8);color:#fff;border-radius:20px;padding:28px 20px;text-align:center;box-shadow:0 8px 24px rgba(23,105,170,.2)}
.hero b{font-size:48px;display:block;line-height:1.1;margin:6px 0}
.card{background:var(--card);border:1px solid var(--ln);border-radius:var(--rad);padding:16px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,.02)}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;margin:6px 0}
textarea{min-height:90px;resize:vertical}
button{background:var(--bl);color:#fff;border:0;border-radius:12px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer;transition:transform .1s,opacity .1s}
button:active{transform:scale(0.98)}
button.g{background:var(--bl2);color:var(--bl)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;overflow-x:auto;background:var(--card);border-top:1px solid var(--ln);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));gap:4px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:none;color:var(--mu);font-size:10px;padding:6px 10px;border-radius:10px;text-align:center}
nav button span{display:block;font-size:20px;margin-bottom:2px}
nav button.on{color:var(--bl);background:var(--bl2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal div{padding:10px 0;border-radius:10px;font-size:14px;position:relative}
.cal .d{background:var(--bg);cursor:pointer}.cal .t{outline:2px solid var(--bl)}.cal .s{background:var(--bl);color:#fff}
.cal .e::after{content:"";position:absolute;bottom:4px;left:calc(50% - 3px);width:6px;height:6px;border-radius:50%;background:#4aa3e8}
.wall{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wall .card{margin:0;padding:10px}
.wall img{width:100%;height:140px;object-fit:cover;border-radius:10px;display:block}
.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.badge{background:var(--bl2);color:var(--bl);padding:4px 8px;border-radius:8px;font-size:12px;font-weight:600}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
var S={};try{S=JSON.parse(localStorage.getItem("us")||"{}")}catch(e){}
S.letters=S.letters||[];S.events=S.events||[];S.wall=S.wall||[];
S.plans=S.plans||[];S.diary=S.diary||[];S.music=S.music||[];
S.quiz=S.quiz||{score1:0,score2:0,done:false};S.dailyQ=S.dailyQ||{date:"",ans1:"",ans2:""};
var tab="home",ym=new Date(),sel=null,openL=-1;

function save(){try{localStorage.setItem("us",JSON.stringify(S))}catch(e){alert("Armazenamento cheio. Reduza o tamanho das imagens.")}}
function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])}
function $(id){return document.getElementById(id)}

var TABS=[
  ["home","💙","Início"],
  ["cal","📅","Agenda"],
  ["wall","📸","História"],
  ["plans","✨","Planos"],
  ["letters","💌","Cartinhas"],
  ["connect","🧩","Conexão"],
  ["diary","📖","Diário"],
  ["music","🎵","Músicas"],
  ["settings","⚙️","Ajustes"]
];

function navBar(){
  $("nav").innerHTML=TABS.map(function(t){
    return '<button class="'+(tab==t[0]?"on":"")+'" onclick="tab=\''+t[0]+'\';render()"><span>'+t[1]+'</span>'+t[2]+'</button>'
  }).join("")
}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

// --- TELA: INÍCIO ---
function renderHome(){
  var h='<h1>💙 US · Our Universe</h1>';
  if(S.since){
    var days=Math.floor((Date.now()-new Date(S.since+"T00:00:00"))/864e5);
    h+='<div class="hero"><span>'+esc(S.n1||"Eu")+' & '+esc(S.n2||"Você")+'</span><b>'+days+'</b>dias construindo nossa história</div>';
    var nx=S.events.filter(function(e){return e.d>=iso(new Date())}).sort(function(a,b){return a.d<b.d?-1:1})[0];
    h+='<div class="card"><b>Próximo compromisso</b><br>'+(nx?esc(nx.t)+' · <b>'+nx.d.split("-").reverse().join("/")+'</b>':'<span class="mu">Nenhum evento próximo agendado.</span>')+'</div>';
    h+='<div class="card grid-2"><div style="text-align:center"><b>'+S.letters.length+'</b><br><span class="mu">Cartinhas</span></div><div style="text-align:center"><b>'+S.wall.length+'</b><br><span class="mu">Memórias</span></div></div>';
  } else {
    h+='<div class="card"><b>Bem-vindos ao US!</b><p class="mu">Configure os nomes e a data de início do relacionamento abaixo para desbloquear todas as funções e o contador de dias.</p></div>';
  }
  h+='<div class="card"><b>Configuração do Casal</b><div class="grid-2"><input id="n1" placeholder="Seu nome" value="'+esc(S.n1||"")+'"><input id="n2" placeholder="Nome do par" value="'+esc(S.n2||"")+'"></div><label class="mu">Início do relacionamento:</label><input id="sn" type="date" value="'+(S.since||"")+'"><button onclick="S.n1=$(\'n1\').value;S.n2=$(\'n2\').value;S.since=$(\'sn\').value;save();render()">Salvar Informações</button></div>';
  return h;
}

// --- TELA: CALENDÁRIO ---
function renderCal(){
  var y=ym.getFullYear(),m=ym.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),td=iso(new Date());
  var h='<h2>📅 Calendário do Casal</h2><div class="card row"><button class="g" onclick="ym=new Date('+y+','+(m-1)+',1);render()">‹ Anterior</button><b>'+ym.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})+'</b><button class="g" onclick="ym=new Date('+y+','+(m+1)+',1);render()">Próximo ›</button></div><div class="card"><div class="cal">';
  "DSTQQSS".split("").forEach(function(c){h+='<div class="mu">'+c+'</div>'});
  for(var i=0;i<first;i++)h+='<div></div>';
  for(var d=1;d<=n;d++){
    var k=y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    var has=S.events.some(function(e){return e.d==k});
    h+='<div class="d '+(k==td?"t ":"")+(k==sel?"s ":"")+(has?"e":"")+'" onclick="sel=\''+k+'\';render()">'+d+'</div>';
  }
  h+='</div></div>';
  if(sel){
    h+='<div class="card"><b>Planos para '+sel.split("-").reverse().join("/")+'</b>';
    S.events.forEach(function(e,i){if(e.d==sel)h+='<div class="row" style="margin-top:8px"><span>💙 '+esc(e.t)+'</span><button class="g" onclick="S.events.splice('+i,1);save();render()">✕</button></div>'});
    h+='<input id="ev" placeholder="Ex: Jantar romântico, Cinema..."><button onclick="addEv()">Adicionar Evento</button></div>';
  } else {
    h+='<p class="mu" style="text-align:center">Toque em um dia do calendário para ver ou adicionar compromissos.</p>';
  }
  return h;
}
function addEv(){var t=$("ev").value.trim();if(!t||!sel)return;S.events.push({d:sel,t:t});save();render()}

// --- TELA: HISTÓRIA / MURAL ---
function renderWall(){
  var h='<h2>📸 Nossa História & Memórias</h2><div class="card"><input id="wt" placeholder="Legenda ou descrição da memória..."><input id="wf" type="file" accept="image/*"><button onclick="addW()">Adicionar Memória</button></div><div class="wall">';
  S.wall.slice().reverse().forEach(function(w,i){
    var k=S.wall.length-1-i;
    h+='<div class="card">'+(w.img?'<img src="'+w.img+'" alt="">':'')+'<p style="margin:8px 0 4px;font-size:14px">'+esc(w.t)+'</p><div class="row"><span class="mu">'+w.d+'</span><button class="g" onclick="if(confirm(\'Excluir memória?\')){S.wall.splice('+k+',1);save();render()}">Excluir</button></div></div>';
  });
  return h+'</div>';
}
function addW(){
  var t=$("wt").value.trim(),f=$("wf").files[0];if(!t&&!f)return;
  function done(img){S.wall.push({t:t,img:img,d:new Date().toLocaleDateString("pt-BR")});save();render()}
  if(!f)return done("");
  var r=new FileReader();
  r.onload=function(){
    var im=new Image();
    im.onload=function(){
      var s=Math.min(1,700/im.width),c=document.createElement("canvas");
      c.width=im.width*s;c.height=im.height*s;
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      done(c.toDataURL("image/jpeg",0.8));
    };
    im.src=r.result;
  };
  r.readAsDataURL(f);
}

// --- TELA: PLANOS DO CASAL ---
function renderPlans(){
  var h='<h2>✨ Nossos Planos & Desejos</h2><div class="card"><input id="pt" placeholder="O que queremos fazer? (Ex: Viagem para a praia)"><select id="pc"><option>Lugares</option><option>Filmes/Séries</option><option>Restaurantes</option><option>Viagens</option><option>Objetivos</option></select><button onclick="addPlan()">Adicionar à Lista</button></div>';
  S.plans.forEach(function(p,i){
    h+='<div class="card row"><div><span class="badge">'+esc(p.cat)+'</span><br><b style="text-decoration:'+(p.done?'line-through':'none')+'">'+esc(p.t)+'</b></div><div><button class="g" onclick="S.plans['+i+'].done=!S.plans['+i+'].done;save();render()">'+(p.done?'Desfazer':'Feito ✔')+'</button> <button class="g" onclick="S.plans.splice('+i+',1);save();render()">✕</button></div></div>';
  });
  return h;
}
function addPlan(){var t=$("pt").value.trim(),c=$("pc").value;if(!t)return;S.plans.push({t:t,cat:c,done:false});save();render()}

// --- TELA: CARTINHAS ---
function renderLetters(){
  var h='<h2>💌 Cartinhas Especiais</h2><div class="card"><input id="lt" placeholder="Título da cartinha"><input id="lf" placeholder="De quem?" value="'+esc(S.n1||"")+'"><textarea id="lb" placeholder="Escreva sua mensagem com carinho..."></textarea><button onclick="addL()">Enviar Cartinha</button></div>';
  S.letters.slice().reverse().forEach(function(l,i){
    var k=S.letters.length-1-i;
    h+='<div class="card"><div class="row" onclick="openL=(openL=='+k+'?-1:'+k+');render()" style="cursor:pointer"><b>'+esc(l.t)+'</b><span class="mu">'+l.d+'</span></div>';
    if(openL==k){
      h+='<p style="white-space:pre-wrap;margin:10px 0">'+esc(l.b)+'</p><div class="row"><span class="mu">De: '+esc(l.f)+'</span><button class="g" onclick="if(confirm(\'Apagar cartinha?\')){S.letters.splice('+k+',1);save();openL=-1;render()}">Apagar</button></div>';
    }
    h+='</div>';
  });
  return h;
}
function addL(){var b=$("lb").value.trim();if(!b)return;S.letters.push({t:$("lt").value||"Mensagem",f:$("lf").value||"Seu Amor",b:b,d:new Date().toLocaleDateString("pt-BR")});save();render()}

// --- TELA: CONEXÃO ---
function renderConnect(){
  var today=iso(new Date());
  if(S.dailyQ.date!==today){S.dailyQ={date:today,ans1:"",ans2:""};save();}
  var h='<h2>🧩 Área de Conexão</h2>';
  h+='<div class="card"><b>💬 Pergunta do Dia</b><p class="mu">Qual é o seu maior sonho para nós nos próximos anos?</p><input id="da1" placeholder="'+esc(S.n1||"Eu")+' responde..." value="'+esc(S.dailyQ.ans1||"")+'"><input id="da2" placeholder="'+esc(S.n2||"Par")+' responde..." value="'+esc(S.dailyQ.ans2||"")+'"><button onclick="saveDaily()">Salvar Respostas</button></div>';
  h+='<div class="card"><b>🎯 Quiz do Casal</b><p class="mu">Quem é mais provável de esquecer onde guardou a chave?</p><div class="row"><button onclick="S.quiz.score1++;save();alert(\'Registrado!\')">'+esc(S.n1||"Eu")+'</button><button onclick="S.quiz.score2++;save();alert(\'Registrado!\')">'+esc(S.n2||"Par")+'</button></div><p class="mu" style="margin-top:8px">Placar: '+esc(S.n1||"Eu")+' ('+S.quiz.score1+') x ('+S.quiz.score2+') '+esc(S.n2||"Par")+'</p></div>';
  return h;
}
function saveDaily(){S.dailyQ.ans1=$("da1").value;S.dailyQ.ans2=$("da2").value;save();alert("Respostas salvas com sucesso!");render()}

// --- TELA: DIÁRIO ---
function renderDiary(){
  var h='<h2>📖 Diário Compartilhado</h2><div class="card"><input id="dt" placeholder="Título do dia"><textarea id="db" placeholder="Como foi o dia de hoje?"></textarea><button onclick="addDiary()">Registrar no Diário</button></div>';
  S.diary.slice().reverse().forEach(function(d,i){
    var k=S.diary.length-1-i;
    h+='<div class="card"><div class="row"><b>'+esc(d.t)+'</b><span class="mu">'+d.date+'</span></div><p style="white-space:pre-wrap;margin:8px 0">'+esc(d.b)+'</p><button class="g" onclick="S.diary.splice('+k+',1);save();render()">Excluir</button></div>';
  });
  return h;
}
function addDiary(){var t=$("dt").value.trim(),b=$("db").value.trim();if(!b)return;S.diary.push({t:t||"Nosso Dia",b:b,date:new Date().toLocaleDateString("pt-BR")});save();render()}

// --- TELA: MÚSICAS ---
function renderMusic(){
  var h='<h2>🎵 Nossas Músicas</h2><div class="card"><input id="mt" placeholder="Nome da música"><input id="ma" placeholder="Artista"><input id="mm" placeholder="Significado especial"><button onclick="addMusic()">Adicionar Música</button></div>';
  S.music.forEach(function(m,i){
    h+='<div class="card row"><div><b>🎵 '+esc(m.t)+'</b> - <span class="mu">'+esc(m.art)+'</span><p style="margin:4px 0 0;font-size:13px">'+esc(m.msg)+'</p></div><button class="g" onclick="S.music.splice('+i+',1);save();render()">✕</button></div>';
  });
  return h;
}
function addMusic(){var t=$("mt").value.trim(),a=$("ma").value.trim(),m=$("mm").value.trim();if(!t)return;S.music.push({t:t,art:a,msg:m});save();render()}

// --- TELA: AJUSTES ---
function renderSettings(){
  return '<h2>⚙️ Ajustes & Tema</h2><div class="card row"><span>Tema Visual</span><span><button class="g" onclick="setTheme(\'light\')">Claro</button> <button class="g" onclick="setTheme(\'dark\')">Escuro</button></span></div><div class="card"><p class="mu">O US foi feito sob medida para vocês. Todos os dados ficam salvos de forma segura neste dispositivo.</p></div>';
}
function setTheme(t){document.documentElement.setAttribute("data-theme",t);S.theme=t;save()}

// --- RENDERIZADOR PRINCIPAL ---
function render(){
  navBar();
  var html="";
  if(tab=="home") html=renderHome();
  else if(tab=="cal") html=renderCal();
  else if(tab=="wall") html=renderWall();
  else if(tab=="plans") html=renderPlans();
  else if(tab=="letters") html=renderLetters();
  else if(tab=="connect") html=renderConnect();
  else if(tab=="diary") html=renderDiary();
  else if(tab=="music") html=renderMusic();
  else if(tab=="settings") html=renderSettings();
  $("app").innerHTML=html;
}

if(S.theme)document.documentElement.setAttribute("data-theme",S.theme);
render();
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
</script>
</body>
</html>
