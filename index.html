<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>US · Our Universe</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1769AA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#f4f8fc;--card:#fff;--tx:#111318;--mu:#5d6b7a;--bl:#1769AA;--bl2:#e3f0fb;--ln:#d9e6f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1118;--card:#171d27;--tx:#f2f6fa;--mu:#9aa9ba;--bl:#4aa3e8;--bl2:#16273a;--ln:#26324280;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1118;--card:#171d27;--tx:#f2f6fa;--mu:#9aa9ba;--bl:#4aa3e8;--bl2:#16273a;--ln:#263242;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:84px}
main{max-width:620px;margin:0 auto;padding:16px}
h1,h2{margin:0 0 10px}h2{font-size:20px}
.hero{background:linear-gradient(140deg,#1769AA,#4aa3e8);color:#fff;border-radius:24px;padding:26px 20px;text-align:center}
.hero b{font-size:56px;display:block;line-height:1}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:14px;margin:12px 0}
input,textarea{width:100%;padding:11px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0}
textarea{min-height:90px;resize:vertical}
button{background:var(--bl);color:#fff;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.g{background:var(--bl2);color:var(--bl)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;color:var(--mu);font-size:11px;padding:6px 2px}
nav button span{display:block;font-size:22px}
nav button.on{color:var(--bl)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal div{padding:9px 0;border-radius:10px;font-size:14px;position:relative}
.cal .d{background:var(--bg);cursor:pointer}.cal .t{outline:2px solid var(--bl)}.cal .s{background:var(--bl);color:#fff}
.cal .e::after{content:"";position:absolute;bottom:3px;left:calc(50% - 3px);width:6px;height:6px;border-radius:50%;background:#4aa3e8}
.wall{columns:2;gap:10px}.wall .card{break-inside:avoid;padding:8px;margin:0 0 10px}
.wall img{width:100%;border-radius:12px;display:block}
.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.hid{display:none}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
var S={};try{S=JSON.parse(localStorage.getItem("us")||"{}")}catch(e){}
S.letters=S.letters||[];S.events=S.events||[];S.wall=S.wall||[];
var tab="home",ym=new Date(),sel=null,open=-1;
function save(){try{localStorage.setItem("us",JSON.stringify(S))}catch(e){alert("Sem espaço para salvar. Tente fotos menores.")}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function $(id){return document.getElementById(id)}
var TABS=[["home","💙","Início"],["letters","💌","Cartinhas"],["cal","📅","Calendário"],["wall","📸","Mural"]];
function nav(){$("nav").innerHTML=TABS.map(function(t){return '<button class="'+(tab==t[0]?"on":"")+'" onclick="tab=\''+t[0]+'\';render()"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join("")}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function home(){
 var h='<h1>💙 US</h1>';
 if(S.since){var d=Math.floor((Date.now()-new Date(S.since+"T00:00:00"))/864e5);
  h+='<div class="hero"><span>'+esc(S.n1||"Eu")+' & '+esc(S.n2||"Você")+'</span><b>'+d+'</b>dias juntos</div>';
  var nx=S.events.filter(function(e){return e.d>=iso(new Date())}).sort(function(a,b){return a.d<b.d?-1:1})[0];
  h+='<div class="card"><b>Próximo plano</b><br>'+(nx?esc(nx.t)+' · '+nx.d.split("-").reverse().join("/"):'<span class="mu">Nada marcado ainda</span>')+'</div>';
  h+='<div class="card row"><span>💌 '+S.letters.length+' cartinhas</span><span>📸 '+S.wall.length+' histórias</span></div>';
 }
 h+='<div class="card"><b>'+(S.since?"Editar":"Configurar")+' o casal</b><input id="n1" placeholder="Seu nome" value="'+esc(S.n1||"")+'"><input id="n2" placeholder="Nome dela" value="'+esc(S.n2||"")+'"><label class="mu">Começamos em:</label><input id="sn" type="date" value="'+(S.since||"")+'"><button onclick="S.n1=$(\'n1\').value;S.n2=$(\'n2\').value;S.since=$(\'sn\').value;save();render()">Salvar</button></div>';
 h+='<div class="card row"><span>Tema</span><span><button class="g" onclick="theme(\'light\')">Claro</button> <button class="g" onclick="theme(\'dark\')">Escuro</button></span></div>';
 h+='<p class="mu">Dica: no celular, abra no navegador e use “Adicionar à tela inicial”. Os dados ficam salvos neste aparelho.</p>';
 return h}
function theme(t){document.documentElement.setAttribute("data-theme",t);S.theme=t;save()}
function letters(){
 var h='<h2>💌 Cartinhas</h2><div class="card"><input id="lt" placeholder="Título"><input id="lf" placeholder="De quem?" value="'+esc(S.n1||"")+'"><textarea id="lb" placeholder="Escreva com carinho..."></textarea><button onclick="addL()">Guardar cartinha</button></div>';
 S.letters.slice().reverse().forEach(function(l,i){var k=S.letters.length-1-i;
  h+='<div class="card"><div class="row" onclick="open=(open=='+k+'?-1:'+k+');render()" style="cursor:pointer"><b>'+esc(l.t)+'</b><span class="mu">'+l.d+'</span></div>';
  if(open==k)h+='<p style="white-space:pre-wrap">'+esc(l.b)+'</p><div class="row"><span class="mu">— '+esc(l.f)+'</span><button class="g" onclick="if(confirm(\'Apagar?\')){S.letters.splice('+k+',1);save();open=-1;render()}">Apagar</button></div>';
  h+='</div>'});
 return h}
function addL(){var b=$("lb").value.trim();if(!b)return;S.letters.push({t:$("lt").value||"Sem título",f:$("lf").value||"Alguém que te ama",b:b,d:new Date().toLocaleDateString("pt-BR")});save();render()}
function cal(){
 var y=ym.getFullYear(),m=ym.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),td=iso(new Date());
 var h='<h2>📅 Calendário juntinhos</h2><div class="row"><button class="g" onclick="ym=new Date(y0,m0-1,1);render()">‹</button><b>'+ym.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})+'</b><button class="g" onclick="ym=new Date(y0,m0+1,1);render()">›</button></div><br><div class="cal">';
 h=h.replace(/y0/g,y).replace(/m0/g,m);
 "DSTQQSS".split("").forEach(function(c){h+='<div class="mu">'+c+'</div>'});
 for(var i=0;i<first;i++)h+='<div></div>';
 for(var d=1;d<=n;d++){var k=y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
  var has=S.events.some(function(e){return e.d==k});
  h+='<div class="d '+(k==td?"t ":"")+(k==sel?"s ":"")+(has?"e":"")+'" onclick="sel=\''+k+'\';render()">'+d+'</div>'}
 h+='</div>';
 if(sel){h+='<div class="card"><b>'+sel.split("-").reverse().join("/")+'</b>';
  S.events.forEach(function(e,i){if(e.d==sel)h+='<div class="row"><span>💙 '+esc(e.t)+'</span><button class="g" onclick="S.events.splice('+i+',1);save();render()">✕</button></div>'});
  h+='<input id="ev" placeholder="Novo plano (ex: Cinema, aniversário...)"><button onclick="addE()">Adicionar</button></div>'}
 else h+='<p class="mu">Toque em um dia para ver ou marcar planos.</p>';
 return h}
function addE(){var t=$("ev").value.trim();if(!t)return;S.events.push({d:sel,t:t});save();render()}
function wall(){
 var h='<h2>📸 Mural de histórias</h2><div class="card"><input id="wt" placeholder="Conte a história desse momento..."><input id="wf" type="file" accept="image/*"><button onclick="addW()">Postar no mural</button></div><div class="wall">';
 S.wall.slice().reverse().forEach(function(w,i){var k=S.wall.length-1-i;
  h+='<div class="card">'+(w.img?'<img src="'+w.img+'" alt="">':'')+'<p style="margin:8px 4px 4px">'+esc(w.t)+'</p><div class="row"><span class="mu">'+w.d+'</span><button class="g" onclick="if(confirm(\'Apagar?\')){S.wall.splice('+k+',1);save();render()}">✕</button></div></div>'});
 return h+'</div>'}
function addW(){var t=$("wt").value.trim(),f=$("wf").files[0];if(!t&&!f)return;
 function done(img){S.wall.push({t:t,img:img,d:new Date().toLocaleDateString("pt-BR")});save();render()}
 if(!f)return done("");
 var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,640/im.width),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);done(c.toDataURL("image/jpeg",.7))};im.src=r.result};r.readAsDataURL(f)}
function render(){nav();$("app").innerHTML={home:home,letters:letters,cal:cal,wall:wall}[tab]()}
if(S.theme)document.documentElement.setAttribute("data-theme",S.theme);
render();
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
</script>
</body>
</html>
